name: "e2e-test-workflow"
description: "Simple workflow for e2e testing"
steps:
  - name: "create-rg"
    command: "group create"
    args:
      name: "{{resource_group}}"
      location: "eastus"
  - name: "verify-rg"
    command: "group show"
    args:
      name: "{{resource_group}}"
    depends_on: ["create-rg"]
