<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140">
  <defs>
    <linearGradient id="azGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4"/>
      <stop offset="100%" style="stop-color:#50e6ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a23"/>
      <stop offset="100%" style="stop-color:#1a1a40"/>
    </linearGradient>
  </defs>
  <rect width="600" height="140" rx="16" fill="url(#bgGrad)"/>
  <!-- Cloud icon -->
  <g transform="translate(30,25)">
    <path d="M75 70c0-16.6 13.4-30 30-30 13.3 0 24.5 8.6 28.5 20.5C137.2 52.2 148 57.5 148 70c0 13.8-11.2 25-25 25H55c-11 0-20-9-20-20s9-20 20-20c1.7 0 3.4.2 5 .6" fill="none" stroke="url(#azGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sim pulse -->
    <circle cx="105" cy="62" r="6" fill="#50e6ff" opacity="0.8">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="62" r="3" fill="#fff"/>
    <!-- Terminal cursor -->
    <rect x="85" y="78" width="40" height="3" rx="1" fill="#50e6ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Text -->
  <text x="195" y="72" font-family="'Segoe UI',system-ui,sans-serif" font-weight="800" font-size="52" fill="white" letter-spacing="-1">floc</text>
  <text x="308" y="72" font-family="'Segoe UI',system-ui,sans-serif" font-weight="800" font-size="52" fill="url(#azGrad)" letter-spacing="-1">-zure</text>
  <text x="195" y="100" font-family="'Segoe UI',system-ui,sans-serif" font-weight="400" font-size="16" fill="#8892b0" letter-spacing="2">AZURE CLOUD SIMULATOR &amp; ORCHESTRATION CLI</text>
</svg>
